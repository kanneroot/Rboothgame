<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DA1745">
<title>Cyber Guardian Challenge</title>
<!--
  Cyber Guardian Challenge - booth quiz game. Single self-contained file, works offline.
  All icons, illustrations and sound effects are original: drawn with inline SVG/CSS/canvas
  and synthesised at runtime with the Web Audio API. No third-party libraries, fonts or media.
  Ricoh logo embedded as supplied by the event owner.
-->
<style>
:root{
  --red:#DA1745; --red-d:#B5103A; --red-l:#fdebef; --char:#656263; --ink:#3b393a; --line:#e7e5e6; --soft:#f6f5f5; --white:#fff;
  --ok:#1a8f5a; --ok-l:#e7f6ee; --warn:#c77700;
  --r:16px; --sh:0 10px 30px rgba(60,40,45,.10), 0 2px 6px rgba(60,40,45,.06);
  --font: "Segoe UI", "Helvetica Neue", Helvetica, Arial, "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", "Noto Sans TC", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body[data-lang=hans]{--font:"Segoe UI","Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif}
button{font:inherit;color:inherit}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.muted{color:var(--char)} .small{font-size:.85em}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}
.screen{display:none;position:relative;z-index:1;min-height:100vh;min-height:100dvh}
.screen#quiz,.screen#host{background:#fff}
.screen.active{display:flex;flex-direction:column;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:48px;padding:.7em 1.3em;border-radius:999px;border:2px solid var(--red);background:var(--red);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;transition:transform .12s, box-shadow .2s, background .2s;box-shadow:0 6px 16px rgba(218,23,69,.25);text-align:center;line-height:1.2}
.btn:hover{background:var(--red-d);border-color:var(--red-d)} .btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--char);border-color:var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--char);color:var(--ink)}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red)} .btn.danger:not(.ghost){background:var(--red);color:#fff} .btn.ghost.danger{color:var(--red);border-color:#f3c3cf}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.big{font-size:1.15rem;min-height:58px;padding:.8em 1.6em}
.btn.sm{min-height:40px;padding:.45em 1em;font-size:.92rem}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:inline-grid;place-items:center;cursor:pointer;color:var(--char);flex:none;transition:.15s}
.icon-btn:hover{border-color:var(--char);color:var(--ink)} .icon-btn.off{color:var(--red);border-color:#f3c3cf}
.icon-btn .ic{width:20px;height:20px}
.lang-switch{display:inline-flex;background:var(--soft);border:1.5px solid var(--line);border-radius:999px;padding:3px;flex:none}
.lang-switch button{border:0;background:transparent;min-width:44px;height:38px;border-radius:999px;font-weight:700;color:var(--char);cursor:pointer;font-size:.95rem;padding:0 .7em}
.lang-switch button.on{background:var(--red);color:#fff;box-shadow:0 3px 8px rgba(218,23,69,.3)}
.top-ctl{display:flex;align-items:center;gap:10px}

/* ---------- HOME ---------- */
.home-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(14px,2.5vw,28px) clamp(16px,4vw,56px) 0}
.home-logo{height:clamp(46px,7vw,96px);width:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .2s, filter .2s;cursor:default}
.home-logo.pressing{transform:scale(.96);filter:drop-shadow(0 0 10px rgba(218,23,69,.35))}
.home-main{flex:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.85fr);gap:clamp(20px,4vw,64px);align-items:center;padding:clamp(16px,3vw,40px) clamp(16px,4vw,56px);max-width:1600px;width:100%;margin:0 auto}
.kicker{display:inline-flex;align-items:center;gap:.5em;color:var(--red);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:clamp(.8rem,1.1vw,1rem);background:var(--red-l);padding:.45em .9em;border-radius:999px}
.hero h1{font-size:clamp(2.1rem,5.2vw,5rem);line-height:1.04;margin:.35em 0 .25em;color:var(--ink);letter-spacing:-.02em}
body[data-lang=hant] .hero h1, body[data-lang=hans] .hero h1{letter-spacing:.02em;line-height:1.15;font-size:clamp(2rem,4.3vw,4.3rem)}
.hero h1,.q-prompt,.res-title{text-wrap:balance}
.hero h1::after{content:"";display:block;width:2.2em;height:.12em;background:var(--red);border-radius:9px;margin-top:.25em}
.sub{font-size:clamp(1.02rem,1.6vw,1.45rem);color:var(--char);margin:0 0 1.4em;max-width:36em;line-height:1.45}
.start-card{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1.5px solid var(--line);border-radius:22px;padding:clamp(16px,2vw,26px);box-shadow:var(--sh);max-width:44rem}
.start-card label{display:block;font-weight:700;color:var(--char);margin-bottom:.55em;font-size:.98rem}
.start-row{display:flex;gap:12px}
#nameIn{flex:1 1 auto;min-width:0;height:58px;border-radius:14px;border:2px solid var(--line);padding:0 18px;font:inherit;font-size:1.15rem;color:var(--ink);background:#fff;outline:none;transition:border .2s, box-shadow .2s}
#nameIn:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(218,23,69,.12)}
#startBtn{animation:breathe 2.4s ease-in-out infinite;white-space:nowrap;flex:none}
@keyframes breathe{0%,100%{box-shadow:0 6px 16px rgba(218,23,69,.25)}50%{box-shadow:0 6px 28px rgba(218,23,69,.5)}}
.resume{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.95rem}
.resume span{flex:1 1 220px}
.resume[hidden]{display:none}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;max-width:44rem}
.tile{flex:1 1 180px;display:flex;align-items:center;gap:.6em;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:.8em 1em;font-weight:600;color:var(--char);font-size:.95rem;line-height:1.3}
.tile .ic{color:var(--red);width:1.5em;height:1.5em}
.home-side{display:flex;flex-direction:column;align-items:center;gap:18px;min-width:0}
.hero-art{width:min(100%,clamp(220px,26vw,420px));aspect-ratio:1}
.hero-art svg, .att-art{width:100%;height:100%;overflow:visible}
.orbit{transform-origin:150px 150px;animation:spin 18s linear infinite} .orbit.o2{animation-duration:11s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.shield-g{animation:float 4s ease-in-out infinite;transform-origin:150px 150px}
@keyframes float{50%{transform:translateY(-8px)}}
.shackle{animation:shackle 4s ease-in-out infinite}
@keyframes shackle{0%,60%,100%{transform:translateY(0)}70%,85%{transform:translateY(-10px)}}
.scanline{animation:scan 3s ease-in-out infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}15%{opacity:.6}85%{opacity:.6}100%{transform:translateY(170px);opacity:0}}
.home-lb{width:100%;max-width:440px;background:rgba(255,255,255,.94);border:1.5px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:var(--sh)}
.home-lb h3,.res-lb h3{display:flex;align-items:center;gap:.5em;margin:0 0 10px;font-size:1.1rem;color:var(--ink)} .home-lb h3 .ic,.res-lb h3 .ic{color:var(--red)}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lb li{display:grid;grid-template-columns:32px 1fr 28px auto;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:var(--soft);font-weight:600}
.lb li.me{background:var(--red-l);outline:2px solid var(--red);animation:pulseRow 1.6s ease-in-out 3}
@keyframes pulseRow{50%{outline-color:transparent}}
.lb-rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--char);font-size:.85rem;border:1.5px solid var(--line)}
.lb li.top1 .lb-rk{background:var(--red);color:#fff;border-color:var(--red)} .lb li.top2 .lb-rk,.lb li.top3 .lb-rk{background:var(--char);color:#fff;border-color:var(--char)}
.lb-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .lb-s{color:var(--red);font-variant-numeric:tabular-nums}
.badge.mini{width:24px;height:26px;display:block}
.lb-empty{color:var(--char);margin:4px 0;font-size:.95rem}
.disc{display:flex;align-items:center;gap:10px;justify-content:center;padding:10px 52px 14px;font-size:.78rem;color:#8d8a8b;text-align:center}
.gear{position:absolute;left:10px;bottom:6px;width:36px;height:36px;border:0;background:transparent;color:#c9c7c8;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.gear:hover{color:var(--char);background:var(--soft)}

/* attract */
#attract{position:fixed;inset:0;z-index:80;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;transition:opacity .3s;cursor:pointer}
#attract.on{opacity:1}
#attract[hidden]{display:none}
[hidden]{display:none !important}
.att-inner{display:flex;flex-direction:column;align-items:center;gap:2vh;text-align:center;padding:20px}
.att-art{width:min(52vmin,440px);height:auto}
.pulse{transform-origin:150px 150px;animation:pulseR 2.6s ease-out infinite} .pulse.p2{animation-delay:1.3s}
@keyframes pulseR{from{transform:scale(.9);opacity:.6}to{transform:scale(1.5);opacity:0}}
.att-txt b{display:block;font-size:clamp(1.8rem,5vw,4rem);color:var(--red);line-height:1.15}
.att-txt span{display:block;font-size:clamp(1.1rem,2.4vw,2rem);color:var(--char);margin-top:.3em}
.att-txt.in{animation:fadeIn .5s ease}
.att-hand{width:64px;height:64px} .ripple{transform-origin:30px 30px;animation:ripple 1.4s ease-out infinite}
@keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(2.8);opacity:0}}
.att-top{display:flex;align-items:center;gap:.6em;font-size:1.1rem;color:var(--char)} .att-top:empty{display:none} .att-top .ic{color:var(--red)} .att-top b{color:var(--red)}

/* ---------- QUIZ ---------- */
.qbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:clamp(10px,1.6vw,22px);padding:10px clamp(12px,2vw,24px);background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line);min-height:72px}
.qlogo{height:34px;width:auto;flex:none;user-select:none}
.qprog{flex:1;min-width:120px;display:flex;flex-direction:column;gap:6px}
.qlabel{font-weight:700;color:var(--char);font-size:.92rem;letter-spacing:.03em}
.qsteps{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.qsteps i{height:8px;border-radius:9px;background:var(--line);transition:.3s}
.qsteps i.ok{background:var(--ok)} .qsteps i.no{background:var(--red)} .qsteps i.cur{background:var(--char);animation:curp 1.2s ease-in-out infinite}
.qsteps i.cur.ok{background:var(--ok);animation:none}.qsteps i.cur.no{background:var(--red);animation:none}
@keyframes curp{50%{opacity:.45}}
.hud{display:flex;align-items:center;gap:clamp(8px,1.2vw,16px)}
.timer{position:relative;width:52px;height:52px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.tr-bg{fill:#fff;stroke:var(--line);stroke-width:4.5}
.tr-fg{fill:none;stroke:var(--char);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:125.66;stroke-dashoffset:0;transition:stroke .3s}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:1.15rem;color:var(--ink);font-variant-numeric:tabular-nums}
.timer.urgent .tr-fg{stroke:var(--red)} .timer.urgent span{color:var(--red);animation:beat 1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.18)}}
.hud-score{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05;min-width:64px}
.hud-score span{font-size:.72rem;color:var(--char);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.hud-score b{font-size:1.55rem;color:var(--red);font-variant-numeric:tabular-nums}
.combo{display:inline-flex;align-items:center;gap:3px;padding:6px 10px;border-radius:999px;background:var(--soft);color:#a3a0a1;font-weight:800;font-size:.95rem;border:1.5px solid var(--line)}
.combo.hot{background:var(--red);color:#fff;border-color:var(--red)} .combo.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.3) rotate(-4deg)}}
.qctl{display:flex;align-items:center;gap:8px}
.q-layout{flex:1;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(360px,1fr);gap:clamp(14px,1.8vw,26px);padding:clamp(12px,1.6vw,24px);min-height:0}
#quiz{height:100vh;height:100dvh}
.stage-wrap{container-type:size;min-height:0;min-width:0;height:100%}
.stage{--u:min(1cqw,1.5cqh);position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;background:#eef0f3;border:1.5px solid var(--line);box-shadow:var(--sh);font-size:clamp(11px,calc(var(--u)*1.6 + 4px),22px);display:flex;align-items:stretch;justify-content:center;padding:clamp(10px,2.2cqw,26px)}
.panel{min-height:0;overflow:auto;padding:4px 4px 8px;display:flex;flex-direction:column}
.q-meta{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.q-num{background:var(--red);color:#fff;font-weight:800;border-radius:10px;padding:4px 10px;font-size:.95rem}
.q-title{font-weight:700;color:var(--char);text-transform:uppercase;letter-spacing:.05em;font-size:.92rem}
body[data-lang=hant] .q-title, body[data-lang=hans] .q-title{letter-spacing:.08em}
.q-prompt{font-size:clamp(1.15rem,1.55vw,1.65rem);line-height:1.35;margin:.1em 0 .4em;color:var(--ink)}
.q-hint{display:flex;align-items:center;gap:.4em;color:#8d8a8b;font-size:.85rem;margin-bottom:10px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;min-height:60px;cursor:pointer;font-size:clamp(.98rem,1.15vw,1.12rem);line-height:1.35;color:var(--ink);transition:transform .12s, border-color .15s, box-shadow .15s, background .2s;position:relative}
.opt:not(:disabled):hover{border-color:var(--red);box-shadow:0 6px 16px rgba(218,23,69,.12);transform:translateY(-1px)}
.opt:not(:disabled):active{transform:scale(.985)}
.ok-k{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--char);font-weight:800;border:1.5px solid var(--line);transition:.2s}
.opt:not(:disabled):hover .ok-k{background:var(--red);color:#fff;border-color:var(--red)}
.ok-t{flex:1;min-width:0} .ok-ic{flex:none;width:26px;display:grid;place-items:center} .ok-ic .ic{width:24px;height:24px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-l)} .opt.right .ok-k{background:var(--ok);color:#fff;border-color:var(--ok)} .opt.right .ok-ic{color:var(--ok)}
.opt.wrongc{border-color:var(--red);background:var(--red-l)} .opt.wrongc .ok-k{background:var(--red);color:#fff;border-color:var(--red)} .opt.wrongc .ok-ic{color:var(--red)}
.opt.dim{opacity:.5}
.opts.done .opt{min-height:50px;padding:8px 12px} .opts.done .ok-k{width:32px;height:32px}
.opt.shake{animation:shake .45s ease} .opt.pop{animation:pop .45s ease}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{40%{transform:scale(1.04)}}
.fb{margin-top:12px;border-radius:18px;padding:14px 16px;border:2px solid;background:#fff}
.fb.anim{animation:fbIn .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes fbIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.fb.ok{border-color:var(--ok);background:linear-gradient(180deg,var(--ok-l),#fff 60%)} .fb.no{border-color:var(--red);background:linear-gradient(180deg,var(--red-l),#fff 60%)}
.fb-h{display:flex;align-items:center;gap:12px}
.fb-ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none} .fb.ok .fb-ic{background:var(--ok)} .fb.no .fb-ic{background:var(--red)}
.fb-ic .ic{width:26px;height:26px}
.fb-h b{display:block;font-size:1.3rem} .fb.ok .fb-h b{color:var(--ok)} .fb.no .fb-h b{color:var(--red)}
.fb-h span{color:var(--char);font-weight:600}
.fb-pts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fb-pts span{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem;font-weight:700;color:var(--char)} .fb-pts .hot{background:var(--red);color:#fff;border-color:var(--red)}
.fb-k{margin-top:10px} .fb-k b{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--char)} .fb-k p{margin:.25em 0 0;font-size:1.05rem;line-height:1.45;color:var(--ink)}
.fb-legend{display:none;list-style:none;margin:8px 0 0;padding:0;flex-direction:column;gap:5px}
.fb-legend li{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600}
.fb-legend li i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font:800 11px/1 var(--font);display:grid;place-items:center;font-style:normal}
.fb-legend li.good i{background:var(--ok)}
.fb-flags{display:flex;align-items:center;gap:.5em;margin-top:8px;font-size:.85rem;color:var(--red);font-weight:600} .fb-flags .ic{width:1em;height:1em}
.fb-src{margin-top:8px;font-size:.74rem;color:#8d8a8b;line-height:1.4;overflow-wrap:anywhere}
.fb .next{margin-top:12px;width:100%}
.float-pts{position:fixed;z-index:95;transform:translateX(-50%);font-weight:900;font-size:1.6rem;pointer-events:none;animation:floatUp 1.4s ease forwards}
.float-pts.ok{color:var(--ok)} .float-pts.no{color:#a3a0a1}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,40px) scale(1)}}
.toast-msg{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:96;background:var(--red);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;display:flex;gap:.5em;align-items:center;box-shadow:0 10px 24px rgba(218,23,69,.35);animation:toastIn 1.9s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-14px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0}}

/* red flags revealed after answering */
.flag{position:relative}
.stage.reveal .flag{outline:2.5px dashed var(--red);outline-offset:3px;border-radius:6px;animation:flagIn .6s ease}
.stage.reveal .flag[data-good]{outline-color:var(--ok)}
.stage.reveal .flag::after{content:attr(data-n);position:absolute;right:-10px;top:-10px;width:21px;height:21px;border-radius:50%;background:var(--red);color:#fff;font:800 12px/21px var(--font);text-align:center;z-index:6;box-shadow:0 2px 6px rgba(0,0,0,.25);letter-spacing:0;text-transform:none;text-decoration:none;animation:popIn .4s cubic-bezier(.2,1.6,.4,1) both}
.stage.reveal .flag[data-good]::after{background:var(--ok)}
@keyframes popIn{from{transform:scale(0)}}
.flag-legend{position:absolute;left:10px;right:10px;bottom:10px;z-index:8;background:rgba(255,255,255,.97);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.18);padding:.6em .9em;font-size:max(12px,.82em);line-height:1.3;animation:fbIn .45s cubic-bezier(.2,1.4,.4,1);max-height:45%;overflow:auto}
.flag-legend b{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:.9em;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}.flag-legend b .ic{color:var(--red)}
.flag-legend ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px 14px}
.flag-legend li{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:600}

.m-cancel{width:100%}

/* ---------- Responsive ---------- */
@media (max-width:1180px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:999px), (max-aspect-ratio:5/4){
  #quiz{height:auto}
  .q-layout{display:flex;flex-direction:column;height:auto;padding:12px}
  .stage-wrap{height:min(50vh,560px);flex:none}
  .panel{overflow:visible}
  .home-main{grid-template-columns:1fr;align-items:start;align-content:center}
  .home-side{flex-direction:row;align-items:center;justify-content:center;flex-wrap:wrap}
  .hero-art{width:clamp(160px,30vw,260px)}
  .home-lb{flex:1 1 320px}
  .res-wrap{grid-template-columns:1fr}
}
@media (max-width:760px){
  .qbar{flex-wrap:wrap;gap:8px 10px;padding:8px 12px}
  .qlogo{height:24px}
  .qprog{order:5;flex:1 1 100%}
  .hud{margin-left:auto}
  .qctl{gap:6px}
  .timer{width:44px;height:44px} .timer span{font-size:1rem}
  .hud-score b{font-size:1.25rem} .hud-score{min-width:48px}
  .icon-btn{width:40px;height:40px}
  .lang-switch button{min-width:36px;height:34px;padding:0 .5em}
  .stage-wrap{height:420px}
  .stage{border-radius:16px}
  .home-side{flex-direction:column}
  .hero-art{display:none}
  .home-lb{flex:none}
  .start-row{flex-direction:column}
  #startBtn{width:100%}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hbar h2{font-size:1.05rem}
  .tile{flex-basis:100%}
}
@media (max-width:999px), (max-aspect-ratio:5/4){ .flag-legend{display:none} .fb-legend{display:flex} }
@media (max-width:480px){
  .qbar .qlogo{display:none}
  .qbar .lang-switch button{min-width:32px;height:32px;padding:0 .4em;font-size:.88rem}
  .qbar .icon-btn{width:36px;height:36px}
  .qbar .combo{padding:4px 6px;font-size:.82rem}
  .qbar{gap:6px 6px;padding:8px 10px}
  .qbar .hud{gap:6px} .qbar .qctl{gap:4px}
  .qbar .timer{width:40px;height:40px} .qbar .timer span{font-size:.95rem}
  .qbar .lang-switch button{min-width:30px}
  .hud-score span{font-size:.62rem}
  .hud{margin-left:0}
  .qctl{margin-left:auto}
  .home-top{flex-wrap:wrap}
  .res-stats b{font-size:1.2rem}
  .rr-dots{grid-template-columns:repeat(6,1fr);row-gap:22px}
}
@media (max-height:820px) and (min-width:1000px) and (min-aspect-ratio:5/4){
  .q-prompt{font-size:1.15rem} .opt{min-height:52px;padding:9px 12px} .opts{gap:8px} .fb{padding:12px 14px} .fb-k p{font-size:.98rem}
  .hero h1{font-size:clamp(2rem,4.4vw,4rem)}
}
@media (min-width:1600px) and (min-height:900px){ html{font-size:19px} .qbar{min-height:84px} .qlogo{height:42px} .timer{width:60px;height:60px} .home-lb{max-width:520px} .lb li{padding:10px 12px;font-size:1.05rem} }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important;animation-iteration-count:1 !important} }

/* ---------- Immersive scenarios (all names, numbers and sites are fictional) ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fl(txt, good){ return ' data-flag="'+esc(txt)+'"'+(good?' data-good="1"':''); }
function winBar(title, extra){ return '<div class="win-bar"><span class="wdots"><i></i><i></i><i></i></span><span class="win-title">'+title+'</span>'+(extra||'')+'</div>'; }
function statusBar(time, dark){ return '<div class="sbar'+(dark?' dark':'')+'"><span>'+time+'</span><span class="sbar-r">'+ic('signal')+ic('wifi')+ic('battery')+'</span></div>'; }

/* deterministic, deliberately non-scannable QR-like pattern (no timing/format data) */
function fakeQR(){
  const N=25; let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  let d=''; const finder=(x,y)=>{ d+=`M${x} ${y}h7v7h-7zM${x+1} ${y+1}v5h5v-5zM${x+2} ${y+2}h3v3h-3z`; };
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9); const inC=(x>8&&x<16&&y>8&&y<16);
    if(!inF && !inC && rnd()>0.52) d+=`M${x} ${y}h1v1h-1z`;
  }
  finder(0,0); finder(N-7,0); finder(0,N-7);
  return `<svg class="qr" viewBox="-2 -2 ${N+4} ${N+4}" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${N+4}" height="${N+4}" fill="#fff"/><path d="${d}" fill="#1d1d1f" fill-rule="evenodd"/><rect x="9" y="9" width="7" height="7" rx="1.2" fill="#fff"/><rect x="10" y="10" width="5" height="5" rx="1" fill="#2a6fdb"/><path d="M11 12.5h3M12.5 11v3" stroke="#fff" stroke-width=".7"/></svg>`;
}

function fmtSec(ms){ return (ms/1000).toFixed(1)+t('sec'); }
function nowISO(){ return new Date().toISOString(); }
function pad(n){ return String(n).padStart(2,'0'); }
function localStamp(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }

/* ---------- Storage ---------- */
const Store = {
  rounds(){ try{ return JSON.parse(localStorage.getItem(KEY_ROUNDS))||[]; }catch(e){ return []; } },
  saveAll(r){ try{ localStorage.setItem(KEY_ROUNDS, JSON.stringify(r)); }catch(e){ console.warn('storage full', e); } },
  upsert(round){ const all=this.rounds(); const i=all.findIndex(x=>x.id===round.id); round.updatedAt=nowISO(); if(i>=0) all[i]=round; else all.push(round); this.saveAll(all); },
  settings(){ try{ return Object.assign({pin:CFG.defaultPin, lang:'en', muted:false}, JSON.parse(localStorage.getItem(KEY_SET))||{}); }catch(e){ return {pin:CFG.defaultPin, lang:'en', muted:false}; } },
  setSetting(k,v){ const s=this.settings(); s[k]=v; localStorage.setItem(KEY_SET, JSON.stringify(s)); },
  clear(){ localStorage.removeItem(KEY_ROUNDS); localStorage.removeItem(KEY_ACTIVE); }
};

/* ---------- Sound (Web Audio synthesis, no audio files) ---------- */
const Sound = (()=>{
  let ctx=null, master=null;
  function ac(){ if(S.muted) return null; if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=.55; master.connect(ctx.destination);}catch(e){ return null; } } if(ctx.state==='suspended') ctx.resume(); return ctx; }
  function tone(f, d, type='sine', v=.2, at=0, f2){ const c=ac(); if(!c) return; const t0=c.currentTime+at; const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t0+d); o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+0.05); }
  function noise(d, v=.15, at=0, fFrom=800, fTo=4000){ const c=ac(); if(!c) return; const t0=c.currentTime+at; const len=Math.floor(c.sampleRate*d); const b=c.createBuffer(1,len,c.sampleRate); const ch=b.getChannelData(0); for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
    const s=c.createBufferSource(); s.buffer=b; const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2; bp.frequency.setValueAtTime(fFrom,t0); bp.frequency.exponentialRampToValueAtTime(fTo,t0+d); const g=c.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+d*.3); g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    s.connect(bp); bp.connect(g); g.connect(master); s.start(t0); s.stop(t0+d); }
  return {
    unlock(){ ac(); },
    click(){ tone(1100,.05,'square',.06); tone(1650,.04,'sine',.05,.01); },
    start(){ noise(.45,.12,0,300,5000); [523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.14,.08*i)); },
    correct(){ tone(784,.12,'triangle',.2); tone(1047,.14,'triangle',.2,.09); tone(1319,.26,'triangle',.2,.18); tone(2637,.2,'sine',.04,.18); },
    wrong(){ tone(330,.18,'sawtooth',.08,0,220); tone(196,.35,'sawtooth',.09,.14,130); },
    tick(urgent){ tone(urgent?1500:1000,.045,'square',urgent?.07:.04); },
    timeout(){ tone(440,.15,'square',.07); tone(440,.15,'square',.07,.2); tone(294,.4,'square',.08,.4); },
    streak(n){ const base=[523,659,784,988,1175,1319]; for(let i=0;i<Math.min(3+n,6);i++) tone(base[i]*1.5,.1,'triangle',.12,.055*i); noise(.3,.05,.1,2000,8000); },
    fanfare(){ const seq=[[523,0],[659,.14],[784,.28],[1047,.42]]; seq.forEach(([f,a])=>{ tone(f,.22,'triangle',.18,a); tone(f/2,.22,'sine',.1,a); });
      [523,659,784,1047].forEach(f=>tone(f,1.1,'triangle',.11,.62)); noise(1,.06,.6,1000,9000); },
    pop(){ tone(600,.08,'sine',.12,0,1200); }
  };
})();

/* ---------- Animated network background ---------- */
const BG = (()=>{
  let cv, cx, W, H, nodes=[], pkts=[], run=false, ptr={x:-999,y:-999}, dpr=1;
  function size(){ dpr=Math.min(window.devicePixelRatio||1,2); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(110, Math.max(36, W*H/16000))); nodes=[]; for(let i=0;i<n;i++) nodes.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*2+1.2,red:Math.random()<.12}); }
  function frame(){ if(!run) return; cx.clearRect(0,0,W,H); const L=Math.min(150, Math.max(100, W/11));
    for(const n of nodes){ n.x+=n.vx; n.y+=n.vy; if(n.x<0||n.x>W) n.vx*=-1; if(n.y<0||n.y>H) n.vy*=-1;
      const dx=ptr.x-n.x, dy=ptr.y-n.y, d=Math.hypot(dx,dy); if(d<160){ n.x-=dx*.004; n.y-=dy*.004; } }
    for(let i=0;i<nodes.length;i++){ const a=nodes[i]; for(let j=i+1;j<nodes.length;j++){ const b=nodes[j]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(d<L){ cx.strokeStyle='rgba(101,98,99,'+(0.16*(1-d/L))+')'; cx.lineWidth=1; cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); cx.stroke();
          if(Math.random()<0.0009 && pkts.length<14) pkts.push({a,b,t:0}); } }
      const dp=Math.hypot(a.x-ptr.x,a.y-ptr.y); if(dp<170){ cx.strokeStyle='rgba(218,23,69,'+(0.35*(1-dp/170))+')'; cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(ptr.x,ptr.y); cx.stroke(); } }
    for(const n of nodes){ cx.fillStyle=n.red?'rgba(218,23,69,.75)':'rgba(101,98,99,.45)'; cx.beginPath(); cx.arc(n.x,n.y,n.r,0,7); cx.fill(); }
    pkts=pkts.filter(p=>p.t<=1); for(const p of pkts){ p.t+=0.018; const x=p.a.x+(p.b.x-p.a.x)*p.t, y=p.a.y+(p.b.y-p.a.y)*p.t; cx.fillStyle='rgba(218,23,69,.9)'; cx.beginPath(); cx.arc(x,y,2.6,0,7); cx.fill(); cx.fillStyle='rgba(218,23,69,.15)'; cx.beginPath(); cx.arc(x,y,7,0,7); cx.fill(); }
    requestAnimationFrame(frame); }
  return { init(el){ cv=el; cx=cv.getContext('2d'); size(); addEventListener('resize',()=>size());
      addEventListener('pointermove',e=>{ptr.x=e.clientX;ptr.y=e.clientY;}); addEventListener('pointerdown',e=>{ptr.x=e.clientX;ptr.y=e.clientY;}); },
    start(){ if(!run){ run=true; requestAnimationFrame(frame);} }, stop(){ run=false; if(cx) cx.clearRect(0,0,W,H); } };
})();

/* ---------- Confetti / burst of shapes ---------- */
const FX = (()=>{
  let cv, cx, parts=[], run=false;
  function size(){ const d=Math.min(devicePixelRatio||1,2); cv.width=innerWidth*d; cv.height=innerHeight*d; cx.setTransform(d,0,0,d,0,0); }
  function loop(){ cx.clearRect(0,0,innerWidth,innerHeight); parts=parts.filter(p=>p.life>0);
    for(const p of parts){ p.vy+=p.g; p.vx*=.992; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=1; cx.save(); cx.globalAlpha=Math.min(1,p.life/40); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.c; cx.strokeStyle=p.c; cx.lineWidth=2;
      const s=p.s; if(p.k===0) cx.fillRect(-s/2,-s/4,s,s/2); else if(p.k===1){ cx.beginPath(); cx.arc(0,0,s/2.4,0,7); cx.fill(); } else if(p.k===2){ cx.beginPath(); cx.moveTo(0,-s/2); cx.lineTo(s/2,s/2); cx.lineTo(-s/2,s/2); cx.closePath(); cx.fill(); }
      else { cx.beginPath(); cx.moveTo(0,-s/2); cx.lineTo(s/2,-s/3); cx.lineTo(s/2,0); cx.quadraticCurveTo(s/2,s/2.2,0,s/1.6); cx.quadraticCurveTo(-s/2,s/2.2,-s/2,0); cx.lineTo(-s/2,-s/3); cx.closePath(); cx.fill(); }
      cx.restore(); }
    if(parts.length) requestAnimationFrame(loop); else { run=false; cx.clearRect(0,0,innerWidth,innerHeight); } }
  function clear(){ parts=[]; }
  const COLS=['#DA1745','#DA1745','#656263','#b5103a','#f08aa2','#9c999a','#ffffff'];
  return { init(el){ cv=el; cx=cv.getContext('2d'); size(); addEventListener('resize',size); }, clear,
    burst(x,y,n=80,spread=1){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=(Math.random()*7+3)*spread; parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4*spread,g:.18,rot:Math.random()*6,vr:(Math.random()-.5)*.3,s:Math.random()*10+6,k:Math.floor(Math.random()*4),c:COLS[Math.floor(Math.random()*COLS.length)],life:120+Math.random()*80}); }
      if(!run){ run=true; requestAnimationFrame(loop); } },
    rain(n=160){ for(let i=0;i<n;i++) parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2,vy:Math.random()*2+2,g:.04,rot:Math.random()*6,vr:(Math.random()-.5)*.2,s:Math.random()*10+7,k:Math.floor(Math.random()*4),c:COLS[Math.floor(Math.random()*COLS.length)],life:260+Math.random()*120});
      if(!run){ run=true; requestAnimationFrame(loop); } } };
})();

/* ---------- Screens ---------- */
function show(name){
  S.screen=name; $$('.screen').forEach(s=>s.classList.toggle('active', s.id===name));

/* ---------- Leaderboard ---------- */
function leaderboard(){ return Store.rounds().filter(r=>r.status==='complete').sort((a,b)=>b.score-a.score||a.totalMs-b.totalMs).slice(0,10); }
function lbHTML(highlightId, limit){
  const lb=leaderboard().slice(0,limit||10); if(!lb.length) return `<p class="lb-empty">${t('noScores')}</p>`;
  return '<ol class="lb">'+lb.map((r,i)=>`<li class="${r.id===highlightId?'me':''} ${i<3?'top'+(i+1):''}"><span class="lb-rk">${i+1}</span><span class="lb-n">${esc(r.name)}</span><span class="lb-b">${badgeSVG(badgeLevel(r.correct),'mini')}</span><span class="lb-s">${r.score}</span></li>`).join('')+'</ol>';
}

/* ---------- Badges ---------- */
function badgeLevel(c){ return c>=12?5:c>=10?4:c>=7?3:c>=4?2:1; }
let _bgid=0;
function badgeSVG(lv, cls){ const gid='bgr'+(++_bgid);
  const stars=[...Array(lv)].map((_,i)=>{ const x=50+(i-(lv-1)/2)*13; return `<path transform="translate(${x} 80) scale(.32)" d="M0-14l4 9 10 1.4-7.3 6.8 1.8 9.8L0 8.4-8.5 13l1.8-9.8L-14-3.6-4-5z" fill="#fff"/>`; }).join('');
  const fill=lv>=4?'#DA1745':lv>=2?'#b0aeaf':'#d0cecf';
  return `<svg class="badge ${cls||''}" viewBox="0 0 100 110" aria-hidden="true"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${lv>=4?'#f04d71':'#e2e0e1'}"/><stop offset="1" stop-color="${fill}"/></linearGradient></defs>
  <path d="M50 4 L90 18 V52 C90 80 72 98 50 106 C28 98 10 80 10 52 V18 Z" fill="url(#${gid})" stroke="${lv>=4?'#a90f35':'#656263'}" stroke-width="3"/>
  <path d="M50 14 L81 25 V52 C81 74 67 88 50 95 C33 88 19 74 19 52 V25 Z" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
  <g transform="translate(50 50)"><rect x="-14" y="-4" width="28" height="22" rx="4" fill="#fff"/><path d="M-8 -4 V-11 a8 8 0 0 1 16 0 V-4" fill="none" stroke="#fff" stroke-width="4"/><circle cx="0" cy="6" r="3.2" fill="${lv>=4?'#DA1745':'#656263'}"/><rect x="-1.3" y="7" width="2.6" height="6" fill="${lv>=4?'#DA1745':'#656263'}"/></g>${stars}</svg>`;
}

/* ---------- HOME ---------- */
function renderHome(){
  $('#homeLb').innerHTML=lbHTML(null,5);
  const act=localStorage.getItem(KEY_ACTIVE); const r=act&&Store.rounds().find(x=>x.id===act);
  const box=$('#resumeBox');
  if(r && r.answers.length<12 && r.status!=='complete' && (Date.now()-Date.parse(r.updatedAt))<30*60000){
    box.hidden=false; box.innerHTML=`<span>${esc(t('resumeQ',{name:r.name,n:r.answers.length}))}</span><button type="button" class="btn sm" data-act="resume">${t('resume')}</button><button type="button" class="btn sm ghost" data-act="discard">${t('discard')}</button>`;
    box.querySelector('[data-act=resume]').onclick=()=>{ Sound.click(); resumeRound(r); };
    box.querySelector('[data-act=discard]').onclick=()=>{ Sound.click(); abandonRound(r); localStorage.removeItem(KEY_ACTIVE); box.hidden=true; };
  } else box.hidden=true;
}
function goHome(){ stopTimer(); clearScene(); Results.stop(); S.round=null; show('home'); renderHome(); }

/* ---------- ROUND ---------- */
function newId(){ return 'R'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase(); }
function startRound(){
  Sound.unlock(); Sound.start();
  let name=$('#nameIn').value.trim().replace(/\s+/g,' ').slice(0,24);
  if(!name) name=t('player')+' '+(Store.rounds().length+1);
  const prev=localStorage.getItem(KEY_ACTIVE); if(prev){ const r=Store.rounds().find(x=>x.id===prev); if(r && r.status!=='complete') abandonRound(r); }
  S.round={ id:newId(), name, lang:S.lang, startedAt:nowISO(), updatedAt:nowISO(), completedAt:null, status:'in_progress', score:0, correct:0, bestStreak:0, totalMs:0, answers:[] };
  Store.upsert(S.round); localStorage.setItem(KEY_ACTIVE, S.round.id);
  S.qi=0; S.streak=0; S.answered=false; $('#nameIn').value='';
  show('quiz'); renderQuestion(); animateNum($('#hudScore'),0,0);
}
function resumeRound(r){ S.round=r; S.answered=false; S.qi=r.answers.length; S.streak=0; for(let i=r.answers.length-1;i>=0&&r.answers[i].is_correct;i--) S.streak++; Sound.unlock(); show('quiz'); renderQuestion(); $('#hudScore').textContent=r.score; }
function abandonRound(r){ if(r.status!=='complete'){ r.status='incomplete'; Store.upsert(r); } }

/* ---------- QUIZ ---------- */
function clearScene(){ sceneTimers.forEach(x=>{clearInterval(x);clearTimeout(x);}); sceneTimers=[]; cancelAnimationFrame(sceneRaf); }
function renderQuestion(keep){ renderQHead(); renderStage(); renderPanel(); if(!keep){ S.answered=false; startTimer(); } }
function renderQHead(){
  const q=Q[S.qi];
  $('#qLabel').textContent=t('question')+' '+pad(q.n)+' / 12';
  $('#qSteps').innerHTML=Q.map((x,i)=>{ const a=S.round.answers[i]; return `<i class="${a?(a.is_correct?'ok':'no'):''} ${i===S.qi?'cur':''}"></i>`; }).join('');
}
function renderStage(){
  const q=Q[S.qi], sc=SCN[q.n], sL=sc.s[S.lang]||sc.s.en;
  clearScene();
  const stage=$('#stage'); stage.className='stage st'+q.n+(S.answered?' reveal':'');
  stage.innerHTML=sc.html(sL); if(sc.init) sc.init(stage.firstElementChild, sL);
  if(S.answered) markFlags();
}
function markFlags(){ const st=$('#stage'); if($('.flag-legend',st)) return; const fls=$$('.flag',st); if(!fls.length) return; fls.forEach((f,i)=>f.dataset.n=i+1);
  const lg=document.createElement('div'); lg.className='flag-legend'; lg.innerHTML=`<b>${ic('flag')}<span>${t('notice')}</span></b><ol>`+fls.map((f,i)=>`<li class="${f.dataset.good?'good':''}"><i>${i+1}</i><span>${esc(f.dataset.flag)}</span></li>`).join('')+'</ol>'; st.appendChild(lg); }
function renderPanel(){
  const q=Q[S.qi], L=qL(q);
  const ans=S.answered?S.round.answers[S.qi]:null;
  $('#panel').innerHTML=`<div class="q-meta"><span class="q-num">${pad(q.n)}</span><span class="q-title">${esc(L.t)}</span></div>
    <h2 class="q-prompt">${esc(L.p)}</h2><div class="q-hint">${ic('target')}<span>${t('chooseOne')}</span></div>
    <div class="opts${ans?' done':''}">${L.o.map((o,i)=>{ const k='ABCD'[i]; let c=''; if(ans){ if(k===q.ans) c='right'; else if(k===ans.chosen_answer) c='wrongc'; else c='dim'; }
      return `<button type="button" class="opt ${c}" data-k="${k}" ${ans?'disabled':''}><span class="ok-k">${k}</span><span class="ok-t">${esc(o)}</span><span class="ok-ic">${ans&&k===q.ans?ic('check'):ans&&k===ans.chosen_answer?ic('x'):''}</span></button>`; }).join('')}</div>
    <div id="fb"></div>`;
  $$('#panel .opt').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.k)));
  if(ans) renderFeedback(ans, !S.justAnswered);
  S.justAnswered=false;
}
function startTimer(){ stopTimer(); S.tStart=performance.now(); S.lastTick=-1; const ring=$('#tRing'), num=$('#tNum'), C=2*Math.PI*20;
  const loop=(now)=>{ const el=now-S.tStart, rem=Math.max(0,CFG.qTime-el), sec=Math.ceil(rem/1000);
    num.textContent=sec; ring.style.strokeDashoffset=String(C*(1-rem/CFG.qTime)); $('#timer').classList.toggle('urgent', rem<=5000);
    if(sec<=5 && sec!==S.lastTick && sec>0){ S.lastTick=sec; Sound.tick(sec<=3); }
    if(rem<=0){ choose(null); return; } S.raf=requestAnimationFrame(loop); };
  S.raf=requestAnimationFrame(loop); }
function stopTimer(){ cancelAnimationFrame(S.raf); }
function choose(k){
  if(S.answered || S.screen!=='quiz') return; S.answered=true; stopTimer();
  const q=Q[S.qi], el=Math.min(CFG.qTime, Math.round(performance.now()-S.tStart)), ok=k===q.ans;
  let base=0,bonus=0,mult=1,pts=0;
  if(ok){ S.streak++; base=CFG.base; bonus=Math.round(CFG.maxTimeBonus*(1-el/CFG.qTime)); mult=MULT[Math.min(S.streak,5)]; pts=Math.round((base+bonus)*mult); } else S.streak=0;
  const a={ question_no:q.n, chosen_answer:k||'', correct_answer:q.ans, is_correct:ok, time_taken_ms:el, points:pts, base, time_bonus:bonus, multiplier:mult, streak:S.streak, timestamp:nowISO(), language:S.lang };
  const r=S.round; r.answers[S.qi]=a; r.score+=pts; r.correct+=ok?1:0; r.totalMs+=el; r.bestStreak=Math.max(r.bestStreak,S.streak);
  if(r.answers.length===12){ r.status='complete'; r.completedAt=nowISO(); localStorage.removeItem(KEY_ACTIVE); }
  Store.upsert(r);  /* cache immediately after every answer */
  if(ok){ Sound.correct(); if(S.streak>=3) setTimeout(()=>Sound.streak(S.streak),260); } else if(k) Sound.wrong(); else Sound.timeout();
  const btn=k&&$(`#panel .opt[data-k="${k}"]`); const rect=(btn||$('#panel')).getBoundingClientRect();
  if(ok) FX.burst(rect.left+rect.width*.15, rect.top+rect.height/2, Math.min(50,22+S.streak*4), .6);
  S.justAnswered=true; renderQHead(); $('#stage').classList.add('reveal'); markFlags(); renderPanel();
  if(btn && !ok){ const nb=$(`#panel .opt[data-k="${k}"]`); nb && nb.classList.add('shake'); }
  if(ok){ const nb=$(`#panel .opt[data-k="${k}"]`); nb && nb.classList.add('pop'); }
  floatPts(pts, ok);
  animateNum($('#hudScore'), r.score-pts, r.score);
  updateCombo();
}
function renderFeedback(a, instant){
  const q=Q[S.qi], L=qL(q), src=SRC[q.src]; const ok=a.is_correct, to=!a.chosen_answer;
  const head= ok? t('correct') : to? t('timeout') : t('wrong');
  const last=S.qi===11;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'} ${instant?'':'anim'}">
    <div class="fb-h"><span class="fb-ic">${ic(ok?'shieldCheck':to?'clock':'alert')}</span><div><b>${head}</b><span>${ok?'+'+a.points+' '+t('pts')+(a.multiplier>1?' \u00b7 '+t('combo')+' x'+a.multiplier:'') : t('correctAnswerIs',{x:q.ans})}</span></div></div>
    ${ok?`<div class="fb-pts"><span>${t('base')} ${a.base}</span><span>${t('timeBonus')} +${a.time_bonus}</span>${a.multiplier>1?`<span class="hot">${t('combo')} x${a.multiplier}</span>`:''}</div>`:''}
    <div class="fb-k"><b>${t('takeaway')}</b><p>${esc(L.k)}</p></div>
    <div class="fb-flags">${ic('flag')}<span>${t('redFlags')}</span></div><ol class="fb-legend">${$$('#stage .flag').map((f,i)=>`<li class="${f.dataset.good?'good':''}"><i>${i+1}</i><span>${esc(f.dataset.flag)}</span></li>`).join('')}</ol>
    <div class="fb-src">${t('source')}: ${esc(src.t)}. <span class="u">${esc(src.u)}</span> ${t('accessed')}.</div>
    <button type="button" class="btn next" id="nextBtn"><span>${last?t('finish'):t('next')}</span>${ic('arrow')}</button></div>`;
  $('#nextBtn').onclick=()=>{ Sound.click(); next(); };
  if(!instant) setTimeout(()=>{ const f=$('#fb .fb'), panel=$('#panel'); if(!f) return; if(getComputedStyle(panel).overflowY==='auto'){ if(panel.scrollHeight>panel.clientHeight) panel.scrollTo({top:panel.scrollHeight,behavior:'smooth'}); } else if(f.getBoundingClientRect().bottom>innerHeight) window.scrollBy({top:f.getBoundingClientRect().bottom-innerHeight+16,behavior:'smooth'}); },120);
}
function next(){ if(S.qi>=11){ finishRound(); return; } S.qi++; S.answered=false; renderQuestion(); updateCombo(); $('#panel').scrollTop=0; window.scrollTo({top:0}); }
function updateCombo(){ const c=$('#hudCombo'); const m=MULT[Math.min(S.streak,5)]; c.innerHTML=`${ic('bolt')}<span>x${m}</span>`; c.classList.toggle('hot', S.streak>=2); c.classList.remove('bump'); void c.offsetWidth; if(S.streak>=2) c.classList.add('bump');
  if(S.streak>=3 && S.answered){ toast(t('streakToast',{n:S.streak})); } }
function floatPts(p, ok){ const h=$('#hudScore').getBoundingClientRect(); const d=document.createElement('div'); d.className='float-pts '+(ok?'ok':'no'); d.textContent=ok?'+'+p:'+0'; d.style.left=(h.left+h.width/2)+'px'; d.style.top=(h.bottom+4)+'px'; document.body.appendChild(d); setTimeout(()=>d.remove(),1400); }
function toast(msg){ const d=document.createElement('div'); d.className='toast-msg'; d.innerHTML=ic('bolt')+'<span>'+esc(msg)+'</span>'; document.body.appendChild(d); setTimeout(()=>d.remove(),1900); }
function animateNum(el, from, to, dur=700){ const t0=performance.now(); const f=(n)=>{ const p=Math.min(1,(n-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=Math.round(from+(to-from)*e).toLocaleString('en-US'); if(p<1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
function quitPrompt(){ Sound.click(); Modal.confirm(t('quitConfirm'), t('yes'), ()=>{ if(S.round) abandonRound(S.round); localStorage.removeItem(KEY_ACTIVE); goHome(); }); }

/* ---------- RESULTS ---------- */
const Results = { iv:0, left:0, stop(){ clearInterval(this.iv); } };
function finishRound(){ stopTimer(); clearScene(); show('results'); renderResults(); Sound.fanfare(); setTimeout(()=>FX.rain(170),200);
  Results.left=CFG.resultsIdle; Results.stop(); updateReturn(); Results.iv=setInterval(()=>{ Results.left--; updateReturn(); if(Results.left<=0) goHome(); },1000); }
function updateReturn(){ const e=$('#returnTxt'); if(e) e.textContent=t('returnIn',{s:Results.left}); }
function renderResults(keep){
  const r=S.round; if(!r) return; const lv=badgeLevel(r.correct);
  const all=Store.rounds().filter(x=>x.status==='complete').sort((a,b)=>b.score-a.score||a.totalMs-b.totalMs); const rank=all.findIndex(x=>x.id===r.id)+1;
  $('#resWrap').innerHTML=`<div class="res-card">
    <div class="res-badge">${badgeSVG(lv,'big')}<div class="rays"></div></div>
    <div class="res-kicker">${t('results')} \u00b7 ${esc(r.name)}</div>
    <h2 class="res-title">${t('b'+lv)}</h2><p class="res-desc">${t('d'+lv)}</p>
    <div class="res-score"><span class="lbl">${t('finalScore')}</span><span class="num" id="resScore">0</span><span class="rank">${t('rankOf',{n:rank,t:all.length})}</span></div>
    <div class="res-stats"><div><b>${r.correct}/12</b><span>${t('correctCount')}</span></div><div><b>${fmtSec(r.totalMs/12)}</b><span>${t('avgTime')}</span></div><div><b>${r.bestStreak}</b><span>${t('bestStreak')}</span></div></div>
    <div class="res-rev"><div class="rr-l">${t('review')}</div><div class="rr-dots">${r.answers.map((a,i)=>`<span class="${a.is_correct?'ok':'no'}" title="${esc(qL(Q[i]).t)}">${ic(a.is_correct?'check':'x')}<em>${i+1}</em></span>`).join('')}</div></div>
    <div class="res-btns"><button type="button" class="btn big" id="againBtn">${ic('refresh')}<span>${t('playAgain')}</span></button><button type="button" class="btn ghost" id="homeBtn2">${ic('home')}<span>${t('home')}</span></button></div>
    <div class="res-ret" id="returnTxt"></div></div>
    <div class="res-lb"><h3>${ic('trophy')}<span>${t('leaderboard')}</span></h3>${lbHTML(r.id,10)}</div>`;
  if(keep) $('#resScore').textContent=r.score.toLocaleString('en-US'); else animateNum($('#resScore'),0,r.score,1600);
  updateReturn();
  $('#againBtn').onclick=()=>{ Sound.click(); goHome(); setTimeout(()=>$('#nameIn').focus(),50); };
  $('#homeBtn2').onclick=()=>{ Sound.click(); goHome(); };
  if(!keep) setTimeout(()=>{ const b=$('.res-badge'); if(!b) return; const rc=b.getBoundingClientRect(); FX.burst(rc.left+rc.width/2, rc.top+rc.height/2, 90, 1); },500);
}

/* ---------- HOST DASHBOARD ---------- */
function stats(){
  const rounds=Store.rounds(); const per=Q.map(q=>({n:q.n, ans:q.ans, tot:0, ok:0, A:0,B:0,C:0,D:0, none:0, ms:0}));
  for(const r of rounds) for(const a of r.answers){ if(!a) continue; const p=per[a.question_no-1]; p.tot++; if(a.is_correct) p.ok++; if(a.chosen_answer) p[a.chosen_answer]++; else p.none++; p.ms+=a.time_taken_ms; }
  const comp=rounds.filter(r=>r.status==='complete'); const allA=rounds.flatMap(r=>r.answers.filter(Boolean));
  return { rounds, per, comp, players:rounds.length, completed:comp.length, incomplete:rounds.length-comp.length,
    avgScore: comp.length? Math.round(comp.reduce((s,r)=>s+r.score,0)/comp.length):0,
    avgCorrect: allA.length? allA.filter(a=>a.is_correct).length/allA.length:0,
    avgMs: allA.length? allA.reduce((s,a)=>s+a.time_taken_ms,0)/allA.length:0 };
}
function renderHost(){
  const st=stats(); const pct=x=>Math.round(x*100)+'%';
  const withData=st.per.filter(p=>p.tot); const hard=withData.slice().sort((a,b)=>a.ok/a.tot-b.ok/b.tot)[0], easy=withData.slice().sort((a,b)=>b.ok/b.tot-a.ok/a.tot)[0];
  const card=(icn,v,l)=>`<div class="kpi">${ic(icn)}<b>${v}</b><span>${l}</span></div>`;
  $('#hostBody').innerHTML=`
  <div class="kpis">${card('users',st.players,t('players'))}${card('check',st.completed,t('completed'))}${card('clock',st.incomplete,t('incomplete'))}${card('star',st.avgScore,t('avgScore'))}${card('target',pct(st.avgCorrect),t('avgCorrect'))}${card('bolt',fmtSec(st.avgMs),t('avgTimeQ'))}</div>
  ${hard?`<div class="insights"><div class="ins bad">${ic('alert')}<span>${t('hardest')}: <b>Q${hard.n} ${esc(qL(Q[hard.n-1]).t)}</b> (${pct(hard.ok/hard.tot)})</span></div><div class="ins good">${ic('shieldCheck')}<span>${t('easiest')}: <b>Q${easy.n} ${esc(qL(Q[easy.n-1]).t)}</b> (${pct(easy.ok/easy.tot)})</span></div></div>`:''}
  <div class="host-actions"><button type="button" class="btn" id="expSum">${ic('download')}<span>${t('exportSummary')}</span></button><button type="button" class="btn" id="expRaw">${ic('download')}<span>${t('exportRaw')}</span></button><button type="button" class="btn ghost danger" id="clrBtn">${ic('trash')}<span>${t('clearAll')}</span></button><button type="button" class="btn ghost" id="pinBtn">${ic('key')}<span>${t('changePin')}</span></button></div>
  <p class="muted small host-hint">${ic('info')} ${t('hostHint')}</p>
  <h3 class="h-sec">${ic('chart')}<span>${t('perQuestion')}</span></h3>
  <div class="tbl-wrap"><table class="qt"><thead><tr><th>${t('qNo')}</th><th>${t('qTitle')}</th><th>${t('responses')}</th><th>${t('correctPct')}</th><th>${t('dist')}</th><th>${t('avgTimeCol')}</th></tr></thead><tbody>
  ${st.per.map(p=>{ const cp=p.tot?p.ok/p.tot:0; return `<tr><td class="c">${p.n}</td><td>${esc(qL(Q[p.n-1]).t)}<span class="ans-k">${p.ans}</span></td><td class="c">${p.tot}</td>
    <td><div class="bar"><i style="width:${cp*100}%" class="${cp<.5?'low':''}"></i></div><span class="bar-v">${p.tot?pct(cp):'-'}</span></td>
    <td><div class="dist">${'ABCD'.split('').map(k=>{ const v=p[k], w=p.tot?v/p.tot:0; return `<div class="d ${k===p.ans?'ok':''}"><span class="dk">${k}</span><span class="dbar"><i style="height:${Math.max(4,w*100)}%"></i></span><span class="dv">${v}</span></div>`; }).join('')}${p.none?`<div class="d none"><span class="dk">-</span><span class="dbar"><i style="height:${Math.max(4,p.none/p.tot*100)}%"></i></span><span class="dv">${p.none}</span></div>`:''}</div></td>
    <td class="c">${p.tot?fmtSec(p.ms/p.tot):'-'}</td></tr>`; }).join('')}
  </tbody></table></div>
  <h3 class="h-sec">${ic('users')}<span>${t('recentRounds')}</span></h3>
  ${st.rounds.length?`<div class="tbl-wrap"><table class="rt"><thead><tr><th>${t('playerCol')}</th><th>${t('dateCol')}</th><th>${t('langCol')}</th><th>${t('answeredCol')}</th><th>${t('score')}</th><th>${t('statusCol')}</th></tr></thead><tbody>
  ${st.rounds.slice().reverse().slice(0,60).map(r=>`<tr><td>${esc(r.name)}</td><td>${localStamp(new Date(r.startedAt))}</td><td>${LANG_LABEL[r.lang]||r.lang}</td><td class="c">${r.answers.filter(Boolean).length}/12</td><td class="c">${r.score}</td><td><span class="pill ${r.status==='complete'?'ok':'warn'}">${r.status==='complete'?t('complete'):t('inProgress')}</span></td></tr>`).join('')}
  </tbody></table></div>`:`<p class="muted">${t('noData')}</p>`}`;
  $('#expSum').onclick=()=>{ Sound.click(); exportSummary(); };
  $('#expRaw').onclick=()=>{ Sound.click(); exportRaw(); };
  $('#clrBtn').onclick=()=>{ Sound.click(); Modal.typed(t('clearConfirm',{n:st.players}), 'DELETE', t('clearBtn'), ()=>{ Store.clear(); toast(t('cleared')); renderHost(); renderHome(); }); };
  $('#pinBtn').onclick=()=>{ Sound.click(); Modal.newPin(); };
}
function openHost(){ Sound.click(); Modal.pin(()=>{ show('host'); renderHost(); }); }

/* ---------- CSV ---------- */
function csvCell(v){ let s=v==null?'':String(v); if(/^[=+\-@\t\r]/.test(s)) s="'"+s; return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function toCSV(rows){ return rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n'; }
function download(name, text){ const b=new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); },1500); toast(t('exported')); }
function stampName(){ const d=new Date(); return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes()); }
function summaryRows(){ const st=stats(); const rows=[['question_no','title','title_zh_hant','title_zh_hans','correct_answer','total_responses','correct_count','correct_pct','count_A','count_B','count_C','count_D','no_answer','avg_response_time_ms']];
  st.per.forEach(p=>{ const q=Q[p.n-1]; rows.push([p.n,q.en.t,q.hant.t,q.hans.t,p.ans,p.tot,p.ok,p.tot?(p.ok/p.tot*100).toFixed(1):'0.0',p.A,p.B,p.C,p.D,p.none,p.tot?Math.round(p.ms/p.tot):0]); }); return rows; }
function rawRows(){ const rows=[['round_id','player_name','timestamp','language','question_no','chosen_answer','correct_answer','is_correct','time_taken_ms','points','round_status','round_started','local_time']];
  Store.rounds().forEach(r=>r.answers.forEach(a=>{ if(!a) return; rows.push([r.id,r.name,a.timestamp,a.language,a.question_no,a.chosen_answer||'NO_ANSWER',a.correct_answer,a.is_correct?'TRUE':'FALSE',a.time_taken_ms,a.points,r.status==='complete'?'complete':'incomplete',r.startedAt,localStamp(new Date(a.timestamp))]); })); return rows; }
function exportSummary(){ download('cyberquiz_summary_'+stampName()+'.csv', toCSV(summaryRows())); }
function exportRaw(){ download('cyberquiz_responses_'+stampName()+'.csv', toCSV(rawRows())); }

/* ---------- Modal ---------- */
const Modal = {
  open(html, onMount){ const m=$('#modal'); m.innerHTML=`<div class="m-box" role="dialog" aria-modal="true">${html}</div>`; m.hidden=false; requestAnimationFrame(()=>m.classList.add('on')); onMount&&onMount(m); },
  close(){ const m=$('#modal'); m.classList.remove('on'); m.hidden=true; m.innerHTML=''; },
  confirm(msg, okTxt, onOk){ this.open(`<div class="m-ic">${ic('alert')}</div><p class="m-msg">${esc(msg)}</p><div class="m-btns"><button type="button" class="btn ghost" data-x>${t('cancel')}</button><button type="button" class="btn" data-ok>${esc(okTxt)}</button></div>`, m=>{ m.querySelector('[data-x]').onclick=()=>{Sound.click();this.close();}; m.querySelector('[data-ok]').onclick=()=>{Sound.click();this.close();onOk();}; }); },
  typed(msg, word, okTxt, onOk){ this.open(`<div class="m-ic danger">${ic('trash')}</div><p class="m-msg">${esc(msg)}</p><input class="m-in" id="typedIn" autocomplete="off" spellcheck="false" placeholder="${word}"><div class="m-btns"><button type="button" class="btn ghost" data-x>${t('cancel')}</button><button type="button" class="btn danger" data-ok disabled>${esc(okTxt)}</button></div>`, m=>{
      const i=m.querySelector('#typedIn'), ok=m.querySelector('[data-ok]'); i.oninput=()=>{ ok.disabled=i.value.trim().toUpperCase()!==word; }; i.focus();
      m.querySelector('[data-x]').onclick=()=>{Sound.click();this.close();}; ok.onclick=()=>{ if(ok.disabled) return; Sound.click(); this.close(); onOk(); }; }); },
  pin(onOk){ let v=''; const keys=['1','2','3','4','5','6','7','8','9','x','0','ok'];
    this.open(`<div class="m-ic">${ic('lock')}</div><h3 class="m-h">${t('pinTitle')}</h3><p class="m-msg">${t('pinPrompt')}</p><div class="pin-dots" id="pinDots"></div><div class="pin-err" id="pinErr"></div>
      <div class="pad">${keys.map(k=>`<button type="button" data-k="${k}" class="${k==='ok'?'pk-ok':k==='x'?'pk-x':''}" aria-label="${k==='x'?'Delete':k==='ok'?t('enter'):k}">${k==='x'?ic('back'):k==='ok'?ic('check'):k}</button>`).join('')}</div><button type="button" class="btn ghost m-cancel" data-x>${t('cancel')}</button>`, m=>{
      const dots=m.querySelector('#pinDots'), err=m.querySelector('#pinErr'); const draw=()=>{ dots.innerHTML=[...Array(Math.max(4,v.length))].map((_,i)=>`<i class="${i<v.length?'on':''}"></i>`).join(''); }; draw();
      const submit=()=>{ if(v===Store.settings().pin){ this.close(); onOk(); } else { err.textContent=t('pinWrong'); Sound.wrong(); dots.classList.add('shake'); setTimeout(()=>dots.classList.remove('shake'),500); v=''; draw(); } };
      m.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{ Sound.click(); const k=b.dataset.k; err.textContent=''; if(k==='x') v=v.slice(0,-1); else if(k==='ok') return submit(); else if(v.length<8) v+=k; draw(); if(v.length===Store.settings().pin.length && v===Store.settings().pin) submit(); });
      m.querySelector('[data-x]').onclick=()=>{Sound.click();this.close();};
      m._key=e=>{ if(/^[0-9]$/.test(e.key)&&v.length<8){v+=e.key;draw(); if(v===Store.settings().pin) submit();} else if(e.key==='Backspace'){v=v.slice(0,-1);draw();} else if(e.key==='Enter') submit(); };
      document.addEventListener('keydown', m._key, {once:false}); const close0=this.close.bind(this); this.close=()=>{ document.removeEventListener('keydown',m._key); this.close=close0; close0(); };
    }); },
  newPin(){ this.open(`<div class="m-ic">${ic('key')}</div><h3 class="m-h">${t('changePin')}</h3><input class="m-in" id="np" inputmode="numeric" maxlength="8" placeholder="${t('newPin')}"><div class="m-btns"><button type="button" class="btn ghost" data-x>${t('cancel')}</button><button type="button" class="btn" data-ok>${t('save')}</button></div>`, m=>{
      const i=m.querySelector('#np'); i.focus(); m.querySelector('[data-x]').onclick=()=>this.close();
      m.querySelector('[data-ok]').onclick=()=>{ const v=i.value.trim(); if(!/^[0-9]{4,8}$/.test(v)){ i.classList.add('shake'); setTimeout(()=>i.classList.remove('shake'),500); return; } Store.setSetting('pin',v); this.close(); toast(t('saved')); }; }); }
};

/* ---------- Idle / attract handling ---------- */
const Idle = {
  tm:0, warned:false,
  reset(){ clearTimeout(this.tm); this.warned=false;
    if(S.screen==='home') this.tm=setTimeout(()=>{ if(S.screen==='home' && $('#modal').hidden && !$('#nameIn').value) Attract.show(); }, CFG.homeAttract);
    else if(S.screen==='quiz') this.tm=setTimeout(()=>{ if(S.screen==='quiz' && S.answered){ if(S.round) abandonRound(S.round); goHome(); } else this.reset(); }, CFG.playIdle);
    else if(S.screen==='host') this.tm=setTimeout(()=>{ if(S.screen==='host'){ Modal.close(); goHome(); } }, 5*60000);
  }
};
const Attract = {
  i:0, iv:0,
  show(){ const a=$('#attract'); a.hidden=false; requestAnimationFrame(()=>a.classList.add('on')); this.i=0; this.cycle(); clearInterval(this.iv); this.iv=setInterval(()=>this.cycle(),3200); },
  cycle(){ const l=LANGS[this.i%3]; this.i++; const tt=T[l]; const el=$('#attractTxt'); el.classList.remove('in'); void el.offsetWidth;
    el.innerHTML=`<b lang="${HTML_LANG[l]}">${tt.tapToPlay}</b><span lang="${HTML_LANG[l]}">${tt.attractLine}</span>`; el.classList.add('in');
    const lb=leaderboard()[0]; $('#attractTop').innerHTML= lb? `${ic('trophy')}<span>${esc(lb.name)}</span><b>${lb.score}</b>` : ''; },
  hide(){ const a=$('#attract'); if(a.hidden) return; a.classList.remove('on'); clearInterval(this.iv); setTimeout(()=>{a.hidden=true;},300); Idle.reset(); }
};

/* ---------- Boot ---------- */
function boot(){
  const st=Store.settings(); S.lang=LANGS.includes(st.lang)?st.lang:'en'; S.muted=!!st.muted;
  $$('.lang-slot').forEach(s=>s.innerHTML=langSwitchHTML());
  $$('.ic-slot').forEach(s=>s.innerHTML=ic(s.dataset.ic));
  document.addEventListener('click',e=>{ const b=e.target.closest('.lang-switch button'); if(b){ Sound.click(); setLang(b.dataset.lang); }
    const m=e.target.closest('.mute-btn'); if(m){ S.muted=!S.muted; Store.setSetting('muted',S.muted); updateMuteBtns(); if(!S.muted) Sound.click(); } });
  BG.init($('#bg')); FX.init($('#fx'));
  $('#startBtn').onclick=startRound;
  $('#nameIn').addEventListener('keydown',e=>{ if(e.key==='Enter') startRound(); });
  $('#quitBtn').onclick=quitPrompt;
  $('#hostBack').onclick=()=>{ Sound.click(); goHome(); };
  $('#gearBtn').onclick=openHost;
  /* long-press the logo for 1.5s to open host access */
  const logo=$('#homeLogo'); let lp=0;
  logo.addEventListener('pointerdown',()=>{ logo.classList.add('pressing'); lp=setTimeout(()=>{ logo.classList.remove('pressing'); openHost(); },1500); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>logo.addEventListener(ev,()=>{ clearTimeout(lp); logo.classList.remove('pressing'); }));
  logo.addEventListener('contextmenu',e=>e.preventDefault());
  ['pointerdown','keydown','pointermove'].forEach(ev=>document.addEventListener(ev,()=>{ if(ev!=='pointermove') Attract.hide(); Idle.reset(); },{passive:true}));
  $('#attract').addEventListener('pointerdown',e=>{ e.stopPropagation(); Sound.unlock(); Sound.pop(); Attract.hide(); setTimeout(()=>$('#nameIn').focus({preventScroll:true}),320); });
  $('#modal').addEventListener('pointerdown',e=>{ if(e.target.id==='modal') Modal.close(); });
  $('#homeTiles').innerHTML=[['clock','how1'],['bolt','how2'],['star','how3']].map(([i,k])=>`<div class="tile">${ic(i)}<span data-i18n="${k}">${t(k)}</span></div>`).join('');
  applyLang(); show('home'); renderHome(); updateCombo();
}
document.addEventListener('DOMContentLoaded', boot);

</script>
